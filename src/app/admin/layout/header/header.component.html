<header
  class="fixed top-0 left-0 right-0 z-50 bg-gradient-to-r from-black via-gray-900 to-black text-white px-6 py-4 shadow-lg" style="overflow: hidden;z-index: 9999;"
>
  <div class="flex items-center justify-between">

    <!-- Left: Logo + Title -->
    <div class="flex items-center gap-3">

      <!-- Toggle Button -->
      <button
        type="button"
        class="p-2 rounded-xl hover:bg-white/10 transition"
        (click)="toggleSidebar.emit()"
      >
        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none">
          <path
            d="M4 6h16M4 12h16M4 18h16"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          />
        </svg>
      </button>

      <!-- Logo -->
      <div class="w-12 h-12 flex items-center justify-center">
        <img src="assets/images/logo.webp" class="w-12 h-12 object-contain" />
      </div>

      <!-- Title -->
      <div>
        <div class="text-lg font-semibold">Admin Dashboard</div>
        <div class="text-xs text-gray-400">System Management Panel</div>
      </div>
    </div>

    <!-- Right: Logout -->
    <button
      type="button"
      (click)="logout()"
      class="flex items-center gap-2 px-4 py-2 rounded-xl bg-red-600 text-white font-medium hover:bg-red-700 transition"
    >
      <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none">
        <path
          d="M16 17l5-5-5-5M21 12H9"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
        <path
          d="M13 5V4a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2v-1"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
      Logout
    </button>

  </div>
</header>
