<ol class="space-y-3">
  <li *ngFor="let item of items; index as i" class="relative pl-7">
    <span class="absolute left-0 top-1.5 h-2.5 w-2.5 rounded-full bg-gray-300"></span>
    <span *ngIf="i < items.length - 1" class="absolute left-1 top-4 bottom-0 w-px bg-gray-200"></span>

    <div class="flex items-start justify-between gap-3">
      <div class="text-sm font-semibold text-gray-900">{{ item.title }}</div>
      <div class="text-xs text-gray-500">
        {{ $any(item.at) | date: 'medium' }}
      </div>
    </div>
    <div *ngIf="item.description" class="mt-1 text-sm text-gray-700">
      {{ item.description }}
    </div>
    <details *ngIf="item.meta" class="mt-2">
      <summary class="cursor-pointer select-none text-xs font-medium text-gray-700 hover:text-gray-900">
        View details
      </summary>
      <pre class="mt-2 overflow-auto rounded-xl border bg-gray-50 p-3 text-xs text-gray-700">{{ item.meta | json }}</pre>
    </details>
  </li>
</ol>
