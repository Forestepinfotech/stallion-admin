<div *ngIf="open" class="fixed inset-0 z-50">
  <div class="absolute inset-0 bg-black/40" (click)="close()"></div>

  <section
    class="absolute right-0 top-0 h-full w-full bg-white shadow-2xl flex flex-col"
    [ngClass]="widthClass"
    role="dialog"
    aria-modal="true"
  >
    <header class="border-b px-6 py-4 flex items-start justify-between gap-4">
      <div class="min-w-0">
        <div class="text-base font-semibold text-gray-900 truncate">{{ title }}</div>
        <div *ngIf="description" class="mt-1 text-sm text-gray-500">{{ description }}</div>
      </div>
      <button
        type="button"
        (click)="close()"
        class="rounded-xl border px-3 py-2 text-sm font-medium text-gray-900 hover:bg-gray-50"
      >
        Close
      </button>
    </header>

    <div class="flex-1 overflow-auto">
      <ng-content></ng-content>
    </div>
  </section>
</div>
