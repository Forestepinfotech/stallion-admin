<div class="p-6">
  <div class="flex items-start justify-between gap-4">
    <div>
      <h1 class="text-2xl font-semibold text-gray-900">Excel Import</h1>
      <p class="mt-1 text-sm text-gray-500">Upload an Excel file to import data.</p>
    </div>
  </div>

  <div class="mt-6">
    <section class="rounded-2xl border bg-white p-4">
      <div
        class="rounded-2xl border-2 border-dashed p-6 text-center transition"
        [class.border-black]="dragActive"
        [class.bg-gray-50]="dragActive"
        (dragover)="onDragOver($event)"
        (dragleave)="onDragLeave($event)"
        (drop)="onDrop($event)"
      >
        <div class="text-sm font-medium text-gray-900">Drag & drop Excel here</div>
        <div class="mt-1 text-xs text-gray-500">Only .xls / .xlsx files</div>

        <div class="mt-4 flex flex-wrap items-center justify-center gap-2">
          <label class="cursor-pointer rounded-xl border px-4 py-2 text-sm hover:bg-gray-50">
            <input
              type="file"
              class="hidden"
              accept=".xls,.xlsx,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
              (change)="onFilePicked($event)"
            />
            Choose File
          </label>

          <button
            type="button"
            class="rounded-xl bg-black px-4 py-2 text-sm text-white disabled:bg-gray-300"
            (click)="upload()"
            [disabled]="!selectedFile() || uploading"
          >
            <span *ngIf="!uploading">Upload</span>
            <span *ngIf="uploading" class="inline-flex items-center gap-2">
              <span class="loader"></span>
              Uploading...
            </span>
          </button>

          <button
            type="button"
            class="rounded-xl border px-4 py-2 text-sm hover:bg-gray-50 disabled:opacity-50"
            (click)="clear()"
            [disabled]="uploading && (selectedFile() || responseJson() || errorMessage())"
          >
            Clear
          </button>
        </div>

        <div class="mt-3 text-xs text-gray-600" *ngIf="selectedFile() as file">
          Selected: <span class="font-medium text-gray-900">{{ file.name }}</span>
          <span class="text-gray-500">({{ (file.size / 1024 / 1024) | number:'1.2-2' }} MB)</span>
        </div>

        <div class="mt-3 text-xs text-gray-600" *ngIf="uploadProgress() !== null">
          Progress: {{ uploadProgress() }}%
        </div>
      </div>

      <div
        *ngIf="errorMessage()"
        class="mt-4 rounded-xl border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-700"
      >
        {{ errorMessage() }}
      </div>

      <div *ngIf="responseJson()" class="mt-4">
        <div class="mb-2 text-sm font-semibold text-gray-900">Response</div>
        <pre class="max-h-[420px] overflow-auto rounded-2xl border bg-gray-50 p-3 text-xs text-gray-800">{{ responseJson() }}</pre>
      </div>
    </section>
  </div>
</div>
